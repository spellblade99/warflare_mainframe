</style></head>
<body>
<div class="frame"><div class="cb tl"></div><div class="cb tr"></div><div class="cb bl"></div><div class="cb br"></div><span class="co a">SYS.LOC // 45.7001, -73.6402</span><span class="co b">SYS_STATUS: ONLINE</span></div>
<div id="tk">&gt; SYSTEM STABLE // WELCOME BACK, RUNNER...</div>
<header>
  <h1>Writing <b>Vault</b></h1>
  <div class="clock"><b id="clk"></b><small id="dt"></small></div>
  <div class="meta">
    <span class="chip c" id="ver"></span><span class="chip" id="dirty"></span>
    <button id="btog">Browse</button>
    <button id="bimp">Import</button><input type="file" id="fimp" accept=".json" hidden>
    <button id="bpull">Pull</button><button class="pri" id="bcom">Commit</button><button id="bgh">GitHub</button>
  </div>
</header>
<div class="wrap">
  <aside class="side" id="side">
    <div class="lab">[MOD_01 // UNIVERSE]</div>
    <div class="urow"><select id="us"></select><button class="sm" id="uadd">+</button><button class="sm" id="uren">&#9998;</button><button class="sm dg" id="udel">&#10005;</button></div>
    <div class="lab">[MOD_02 // PROJECTS]</div>
    <div id="tree"></div>
    <button class="sm" id="padd" style="margin-top:8px">+ Project</button>
  </aside>
  <section class="main">
    <div class="crumb" id="crumb"></div>
    <div class="tabs"><button class="on">List</button><button disabled title="Next slice">Canvas</button><button disabled title="Later slice">Setting timeline</button><button disabled title="Later slice">Story timeline</button></div>
    <div class="tool"><input type="text" id="q" placeholder="Search name, tags, summary"><select id="ft"></select><select id="nt"></select><button class="pri" id="nadd">+ New</button></div>
    <div class="tags" id="tags"></div>
    <div id="list"></div>
  </section>
</div>

<dialog id="ed"><div class="dh"><h3 id="edt">Entity</h3><button data-x>X</button></div><div class="db" id="edb"></div></dialog>
<dialog id="dgh"><div class="dh"><h3>GitHub connection</h3><button data-x>X</button></div><div class="db">
  <div class="two"><label>Owner<input type="text" id="o"></label><label>Repo<input type="text" id="r"></label></div>
  <div class="two"><label>Branch<input type="text" id="b"></label><label>Data folder in repo<input type="text" id="dir"></label></div>
  <label>Personal access token<input type="text" id="t" autocomplete="off" style="-webkit-text-security:disc"></label>
  <label class="ck"><input type="checkbox" id="rem"> Remember token on this device</label>
  <div class="note">Fine-grained PAT, one repo, Contents: read &amp; write. The repo needs at least one commit (a README is enough).</div>
  <button class="pri" id="save">Save &amp; test</button>
</div></dialog>
<div id="toast"></div>

<script>
const VER='0.1.2',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const by=(a,b)=>a.name.localeCompare(b.name);
const TY={character:['Role','Age','Aliases'],location:['Region','Climate'],item:['Owner','Origin'],faction:['Leader','Goal'],note:[],idea:[]};
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3600)}

/* config: reuses launcher repo/token when they share this browser origin */
let L={};try{L=JSON.parse(localStorage.wfcfg||'{}')}catch{}
let cfg={owner:L.owner||'',repo:L.repo||'',branch:L.branch||'main',dir:'vault',...JSON.parse(localStorage.wvcfg||'{}')};
const tok=()=>sessionStorage.wvtok||localStorage.wvtok||sessionStorage.wftoken||localStorage.wftoken||'';
const ready=()=>cfg.owner&&cfg.repo&&tok();

/* local store: one record per file, path -> {path,data,sha,dirty,del} */
const idb=new Promise((r,j)=>{const q=indexedDB.open('wv-vault',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'path'});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const io=async(m,f)=>{const d=await idb;return new Promise((r,j)=>{const t=d.transaction('f',m);const q=f(t.objectStore('f'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})};
const F=new Map();
const store=r=>{F.set(r.path,r);return io('readwrite',s=>s.put(r))};
const drop=p=>{F.delete(p);return io('readwrite',s=>s.delete(p))};
const kind=p=>{const a=p.split('/');return a[2]==='u.json'?'u':a[2]};
const pth=(k,u,id)=>k==='u'?`u/${u}/u.json`:`u/${u}/${k}/${id}.json`;
const all=(k,u)=>[...F.values()].filter(r=>!r.del&&kind(r.path)===k&&(!u||r.path.split('/')[1]===u)).map(r=>r.data);
const get=(k,u,id)=>{const r=F.get(pth(k,u,id));return r&&!r.del?r.data:null};
async function save(k,u,d){d.updated=Date.now();const p=pth(k,u,d.id);await store({...(F.get(p)||{}),path:p,data:d,dirty:true,del:false})}
async function rm(k,u,id){const p=pth(k,u,id),o=F.get(p);if(!o)return;o.sha?await store({...o,del:true,dirty:true}):await drop(p)}

/* GitHub sync (Git Data API: one commit per Commit press) */
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const rp=p=>cfg.dir.replace(/^\/|\/$/g,'')+'/'+p;
async function gh(p,o={}){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${p}`,{...o,headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json',...(o.headers||{})}});if(!r.ok){let m=r.status;try{m+=' '+(await r.json()).message}catch{}throw new Error(m)}return r.json()}
async function remote(){
  const br=await gh('/git/ref/heads/'+encodeURIComponent(cfg.branch)),c=await gh('/git/commits/'+br.object.sha),t=await gh('/git/trees/'+c.tree.sha+'?recursive=1'),pre=rp('');
  return{head:br.object.sha,tree:c.tree.sha,files:t.tree.filter(x=>x.type==='blob'&&x.path.startsWith(pre)&&x.path.endsWith('.json')).map(x=>[x.path.slice(pre.length),x.sha])}}
async function pull(){
  const t=await remote(),rem=new Map(t.files);let n=0,k=0;
  const need=t.files.filter(([p,s])=>!(F.get(p)&&F.get(p).sha===s));
  for(let i=0;i<need.length;i+=8)await Promise.all(need.slice(i,i+8).map(async([p,sha])=>{
    const d=JSON.parse(b64d((await gh('/git/blobs/'+sha)).content)),o=F.get(p);
    if(o&&o.dirty&&(o.data.updated||0)>=(d.updated||0)){k++;await store({...o,sha});return}
    await store({path:p,data:d,sha,dirty:false,del:false});n++}));
  for(const [p,o] of [...F])if(o.sha&&!rem.has(p)&&!o.dirty)await drop(p);
  return{n,k}}
async function commit(){
  await pull();
  const dirty=[...F.values()].filter(r=>r.dirty);if(!dirty.length)return 0;
  const t=await remote();
  const tree=dirty.map(r=>r.del?{path:rp(r.path),mode:'100644',type:'blob',sha:null}:{path:rp(r.path),mode:'100644',type:'blob',content:JSON.stringify(r.data,null,1)});
  const nt=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:t.tree,tree})});
  const nc=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:'Vault update '+new Date().toISOString().slice(0,16).replace('T',' '),tree:nt.sha,parents:[t.head]})});
  await gh('/git/refs/heads/'+encodeURIComponent(cfg.branch),{method:'PATCH',body:JSON.stringify({sha:nc.sha})});
  const m=new Map((await gh('/git/trees/'+nt.sha+'?recursive=1')).tree.map(x=>[x.path,x.sha]));
  for(const r of dirty)r.del?await drop(r.path):await store({...F.get(r.path),sha:m.get(rp(r.path)),dirty:false});
  return dirty.length}
async function run(label,fn){
  if(!ready())return toast('Connect GitHub first',1);
  toast(label+'...');
  try{await fn();render()}catch(e){toast(/404|409/.test(e.message)?'Repo/branch not found or empty. Add a README commit first. ('+e.message+')':e.message,1)}
}

/* UI state */
const ui={u:localStorage.wvu||null,p:null,w:null,q:'',type:'',tag:''};
const ids=()=>ui.w?[ui.w]:ui.p?[ui.p,...all('w',ui.u).filter(w=>w.pid===ui.p).map(w=>w.id)]:null;
function render(){
  const us=all('u').sort(by);
  if(!us.find(u=>u.id===ui.u))ui.u=us[0]?us[0].id:null;
  localStorage.wvu=ui.u||'';
  const ps=all('p',ui.u).sort(by),ws=all('w',ui.u);
  $('#us').innerHTML=us.map(u=>`<option value="${u.id}"${u.id===ui.u?' selected':''}>${esc(u.name)}</option>`).join('')||'<option>No universe yet</option>';
  $('#tree').innerHTML=ui.u?`<div class="nd ${!ui.p&&!ui.w?'on':''}" data-s="">&#9670; All in universe</div>`+ps.map(p=>
    `<div class="nd ${ui.p===p.id&&!ui.w?'on':''}" data-s="p:${p.id}">${esc(p.name)}<span><b data-a="addw:${p.id}" title="Add work">+</b><b data-a="ren:p:${p.id}">&#9998;</b><b data-a="del:p:${p.id}">&#10005;</b></span></div>`+
    ws.filter(w=>w.pid===p.id).sort(by).map(w=>`<div class="nd w ${ui.w===w.id?'on':''}" data-s="w:${p.id}:${w.id}">${esc(w.name)}<span><b data-a="ren:w:${w.id}">&#9998;</b><b data-a="del:w:${w.id}">&#10005;</b></span></div>`).join('')).join(''):'';
  const un=us.find(u=>u.id===ui.u),pn=ps.find(p=>p.id===ui.p),wn=ws.find(w=>w.id===ui.w);
  $('#crumb').textContent=[un&&un.name,pn&&pn.name,wn&&wn.name].filter(Boolean).join('  \u203A ')||'Create a universe to begin';
  const sc=ids(),q=ui.q.toLowerCase(),es=all('e',ui.u);
  const tg=[...new Set(es.flatMap(e=>e.tags||[]))].sort();
  $('#tags').innerHTML=tg.map(t=>`<i class="${ui.tag===t?'on':''}" data-t="${esc(t)}">#${esc(t)}</i>`).join('');
  $('#ft').innerHTML='<option value="">All types</option>'+Object.keys(TY).map(t=>`<option${ui.type===t?' selected':''}>${t}</option>`).join('');
  $('#nt').innerHTML=Object.keys(TY).map(t=>`<option>${t}</option>`).join('');
  const rows=es.filter(e=>(!sc||(e.refs||[]).some(r=>sc.includes(r)))&&(!ui.type||e.type===ui.type)&&(!ui.tag||(e.tags||[]).includes(ui.tag))&&(!q||(e.name+' '+(e.tags||[]).join(' ')+' '+(e.summary||'')).toLowerCase().includes(q))).sort(by);
  $('#list').innerHTML=!ui.u?'<div class="empty">No universe yet. Tap + beside Universe.</div>':rows.length?rows.map(e=>`<div class="row" data-e="${e.id}"><span class="chip c">${e.type}</span><b>${esc(e.name)}</b><span class="tg">${(e.tags||[]).map(t=>`<i data-t="${esc(t)}">#${esc(t)}</i>`).join('')}</span><span class="dt">${new Date(e.updated).toLocaleDateString()}</span></div>`).join(''):'<div class="empty">Nothing here yet. Use + New.</div>';
  const n=[...F.values()].filter(r=>r.dirty).length;
  const d=$('#dirty');d.textContent=n?n+' unsynced':'Synced';d.className='chip '+(n?'a':'g');
  $('#tk').textContent='> SYSTEM STABLE // '+(n?n+' CHANGE(S) UNSYNCED':'DATA SYNCED')+' // WELCOME BACK, RUNNER...';
}

/* hierarchy actions */
const ask=(m,v)=>{const r=prompt(m,v||'');return r&&r.trim()?r.trim():null};
async function addU(){const n=ask('Universe name');if(!n)return;const id=uid();await save('u',id,{id,name:n});ui.u=id;ui.p=ui.w=null;render()}
async function addP(){if(!ui.u)return toast('Create a universe first',1);const n=ask('Project name');if(!n)return;const id=uid();await save('p',ui.u,{id,name:n});ui.p=id;ui.w=null;render()}
async function addW(pid){const n=ask('Work name');if(!n)return;const id=uid();await save('w',ui.u,{id,pid,name:n});ui.p=pid;ui.w=id;render()}
async function ren(k,id){const d=k==='u'?get('u',id,id):get(k,ui.u,id);const n=d&&ask('Rename',d.name);if(n){d.name=n;await save(k,k==='u'?id:ui.u,d);render()}}
async function del(k,id){
  if(k==='u'){if(!confirm('Delete this universe and everything in it?'))return;for(const p of [...F.keys()].filter(p=>p.startsWith(`u/${id}/`)))await rm(kind(p),id,p.split('/').pop().replace('.json',''));ui.u=null}
  else{if(!confirm('Delete this '+(k==='p'?'project and its works':'work')+'? (Entities are kept.)'))return;
    if(k==='p')for(const w of all('w',ui.u).filter(w=>w.pid===id))await rm('w',ui.u,w.id);
    await rm(k,ui.u,id);if(ui.p===id||ui.w===id)ui.p=ui.w=null}
  render()}

/* entity editor */
let cur=null;
function fieldRow(k,v){return `<div class="fr"><input type="text" class="fk" placeholder="Field" value="${esc(k)}"><input type="text" class="fv" placeholder="Value" value="${esc(v)}"><button class="sm dg" data-rf>&#10005;</button></div>`}
function openEd(e,isNew){
  cur=e;$('#edt').textContent=isNew?'New '+e.type:'Edit entity';
  const ps=all('p',ui.u).sort(by),ws=all('w',ui.u),chk=(id,n,ind)=>`<label class="ck" style="margin-left:${ind}px"><input type="checkbox" value="${id}"${(e.refs||[]).includes(id)?' checked':''}>${esc(n)}</label>`;
  $('#edb').innerHTML=`<label>Name<input type="text" id="en" value="${esc(e.name)}"></label>
  <div class="two"><label>Type<select id="et">${Object.keys(TY).map(t=>`<option${e.type===t?' selected':''}>${t}</option>`).join('')}</select></label><label>Tags (comma separated)<input type="text" id="eg" value="${esc((e.tags||[]).join(', '))}"></label></div>
  <label>Summary<textarea id="es" style="min-height:60px">${esc(e.summary)}</textarea></label>
  <div><div class="lab">Details</div><div id="fl">${(e.fields||[]).map(f=>fieldRow(f.k,f.v)).join('')}</div><button class="sm" id="af">+ Field</button></div>
  <label>Notes<textarea id="eno">${esc(e.notes)}</textarea></label>
  <div><div class="lab">Appears in</div>${ps.map(p=>chk(p.id,p.name,0)+ws.filter(w=>w.pid===p.id).sort(by).map(w=>chk(w.id,w.name,22)).join('')).join('')||'<div class="note">No projects yet.</div>'}</div>
  <div class="acts"><button class="pri" id="esv">Save</button>${isNew?'':'<button class="dg" id="edl">Delete</button>'}</div>`;
  $('#ed').showModal();
}
function newEnt(){
  if(!ui.u)return toast('Create a universe first',1);
  const type=$('#nt').value||'character',sc=ui.w||ui.p;
  openEd({id:uid(),type,name:'',tags:[],refs:sc?[sc]:[],summary:'',notes:'',fields:TY[type].map(k=>({k,v:''}))},true)}

/* events */
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#uadd').onclick=addU;$('#padd').onclick=addP;$('#nadd').onclick=newEnt;
$('#uren').onclick=()=>ui.u&&ren('u',ui.u);$('#udel').onclick=()=>ui.u&&del('u',ui.u);
$('#us').onchange=e=>{ui.u=e.target.value;ui.p=ui.w=null;ui.tag='';render()};
$('#q').oninput=e=>{ui.q=e.target.value;render()};$('#ft').onchange=e=>{ui.type=e.target.value;render()};
$('#btog').onclick=()=>$('#side').classList.toggle('open');
$('#side').onclick=e=>{
  const a=e.target.closest('[data-a]');
  if(a){const [c,x,y]=a.dataset.a.split(':');if(c==='addw')addW(x);if(c==='ren')ren(x,y);if(c==='del')del(x,y);return}
  const n=e.target.closest('[data-s]');if(!n)return;
  const [t,x,y]=n.dataset.s.split(':');ui.p=t?x:null;ui.w=t==='w'?y:null;
  $('#side').classList.remove('open');render()};
$('#tags').onclick=e=>{const t=e.target.closest('[data-t]');if(t){ui.tag=ui.tag===t.dataset.t?'':t.dataset.t;render()}};
$('#list').onclick=e=>{
  const t=e.target.closest('[data-t]');if(t){ui.tag=ui.tag===t.dataset.t?'':t.dataset.t;return render()}
  const r=e.target.closest('[data-e]');if(r)openEd(structuredClone(get('e',ui.u,r.dataset.e)),false)};
$('#edb').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='af')$('#fl').insertAdjacentHTML('beforeend',fieldRow('',''));
  if(b.dataset.rf!==undefined)b.parentElement.remove();
  if(b.id==='edl'&&confirm('Delete this entity?')){await rm('e',ui.u,cur.id);$('#ed').close();render()}
  if(b.id==='esv'){
    const d=cur;d.name=$('#en').value.trim()||'Untitled';d.type=$('#et').value;
    d.tags=$('#eg').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
    d.summary=$('#es').value;d.notes=$('#eno').value;
    d.fields=[...document.querySelectorAll('#fl .fr')].map(r=>({k:r.querySelector('.fk').value.trim(),v:r.querySelector('.fv').value})).filter(f=>f.k);
    d.refs=[...document.querySelectorAll('#edb .ck input:checked')].map(c=>c.value);
    await save('e',ui.u,d);$('#ed').close();render()}};
$('#bpull').onclick=()=>run('Pulling',async()=>{const r=await pull();toast(r.n+' file(s) updated'+(r.k?', '+r.k+' kept local (newer)':''))});
$('#bcom').onclick=()=>run('Committing',async()=>{const n=await commit();toast(n?n+' change(s) committed':'Nothing to commit')});
$('#bgh').onclick=()=>{$('#o').value=cfg.owner;$('#r').value=cfg.repo;$('#b').value=cfg.branch;$('#dir').value=cfg.dir;$('#t').value=tok();$('#rem').checked=!!localStorage.wvtok;$('#dgh').showModal()};
$('#save').onclick=async()=>{
  cfg={owner:$('#o').value.trim(),repo:$('#r').value.trim(),branch:$('#b').value.trim()||'main',dir:$('#dir').value.trim()||'vault'};
  localStorage.wvcfg=JSON.stringify(cfg);sessionStorage.removeItem('wvtok');localStorage.removeItem('wvtok');
  ($('#rem').checked?localStorage:sessionStorage).wvtok=$('#t').value.trim();
  try{const r=await gh('');toast('Connected to '+r.full_name);$('#dgh').close()}catch(e){toast('Failed: '+e.message,1)}};

$('#bimp').onclick=()=>$('#fimp').click();
$('#fimp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const b=JSON.parse(await f.text());
    if(b.format!=='wv-bundle'||!Array.isArray(b.files))throw new Error('Not a vault bundle file');
    if(!confirm('Import '+b.files.length+' items? Items with the same id will be replaced.'))return;
    for(const x of b.files)await store({...(F.get(x.path)||{}),path:x.path,data:x.data,dirty:true,del:false});
    const u=b.files.find(x=>kind(x.path)==='u');if(u)ui.u=u.data.id;ui.p=ui.w=null;ui.tag='';
    render();toast(b.files.length+' items imported. Review them, then press Commit.');
  }catch(err){toast(err.message,1)}
};
/* init */
$('#ver').textContent='v'+VER;
function tick(){const d=new Date();$('#clk').textContent=d.toLocaleTimeString([],{hour12:false});$('#dt').textContent=d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})+' // SYNC: '+(ready()?'OK':'OFFLINE')}
tick();setInterval(tick,1000);
(async()=>{(await io('readonly',s=>s.getAll())).forEach(r=>F.set(r.path,r));render()})();
</script>
</body></html>
