<div class="frame"><div class="cb tl"></div><div class="cb tr"></div><div class="cb bl"></div><div class="cb br"></div><span class="co a">SYS.LOC // 45.7001, -73.6402</span><span class="co b">SYS_STATUS: ONLINE</span></div>

<script>
const VER='0.3.0',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
const by=(a,b)=>a.name.localeCompare(b.name);
const TY={character:['Role','Age','Aliases'],location:['Region','Climate'],item:['Owner','Origin'],faction:['Leader','Goal'],note:[],idea:[]};
function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3600)}

/* config: reuses launcher repo/token when they share this browser origin */
let L={};try{L=JSON.parse(localStorage.wfcfg||'{}')}catch{}
let cfg={owner:L.owner||'',repo:L.repo||'',branch:L.branch||'main',dir:'vault',...JSON.parse(localStorage.wvcfg||'{}')};
const tok=()=>sessionStorage.wvtok||localStorage.wvtok||sessionStorage.wftoken||localStorage.wftoken||'';
const ready=()=>cfg.owner&&cfg.repo&&tok();

/* local store: one record per file, path -> {path,data,sha,dirty,del} */
const idb=new Promise((r,j)=>{const q=indexedDB.open('wv-vault',1);q.onupgradeneeded=()=>q.result.createObjectStore('f',{keyPath:'path'});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const io=async(m,f)=>{const d=await idb;return new Promise((r,j)=>{const t=d.transaction('f',m);const q=f(t.objectStore('f'));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>j(t.error)})};
const F=new Map();
const store=r=>{F.set(r.path,r);return io('readwrite',s=>s.put(r))};
const drop=p=>{F.delete(p);return io('readwrite',s=>s.delete(p))};
const kind=p=>{const a=p.split('/');return a[2]==='u.json'?'u':a[2]};
const pth=(k,u,id)=>k==='u'?`u/${u}/u.json`:`u/${u}/${k}/${id}.json`;
const all=(k,u)=>[...F.values()].filter(r=>!r.del&&kind(r.path)===k&&(!u||r.path.split('/')[1]===u)).map(r=>r.data);
const get=(k,u,id)=>{const r=F.get(pth(k,u,id));return r&&!r.del?r.data:null};
async function save(k,u,d){d.updated=Date.now();const p=pth(k,u,d.id);await store({...(F.get(p)||{}),path:p,data:d,dirty:true,del:false})}
async function rm(k,u,id){const p=pth(k,u,id),o=F.get(p);if(!o)return;o.sha?await store({...o,del:true,dirty:true}):await drop(p)}

/* GitHub sync (Git Data API: one commit per Commit press) */
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const rp=p=>cfg.dir.replace(/^\/|\/$/g,'')+'/'+p;
async function gh(p,o={}){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}${p}`,{...o,headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json',...(o.headers||{})}});if(!r.ok){let m=r.status;try{m+=' '+(await r.json()).message}catch{}throw new Error(m)}return r.json()}
async function remote(){
  const br=await gh('/git/ref/heads/'+encodeURIComponent(cfg.branch)),c=await gh('/git/commits/'+br.object.sha),t=await gh('/git/trees/'+c.tree.sha+'?recursive=1'),pre=rp('');
  return{head:br.object.sha,tree:c.tree.sha,files:t.tree.filter(x=>x.type==='blob'&&x.path.startsWith(pre)&&x.path.endsWith('.json')).map(x=>[x.path.slice(pre.length),x.sha])}}
async function pull(){
  const t=await remote(),rem=new Map(t.files);let n=0,k=0;
  const need=t.files.filter(([p,s])=>!(F.get(p)&&F.get(p).sha===s));
  for(let i=0;i<need.length;i+=8)await Promise.all(need.slice(i,i+8).map(async([p,sha])=>{
    const d=JSON.parse(b64d((await gh('/git/blobs/'+sha)).content)),o=F.get(p);
    if(o&&o.dirty&&(o.data.updated||0)>=(d.updated||0)){k++;await store({...o,sha});return}
    await store({path:p,data:d,sha,dirty:false,del:false});n++}));
  for(const [p,o] of [...F])if(o.sha&&!rem.has(p)&&!o.dirty)await drop(p);
  return{n,k}}
async function commit(){
  await pull();
  const dirty=[...F.values()].filter(r=>r.dirty);if(!dirty.length)return 0;
  const t=await remote();
  const tree=dirty.map(r=>r.del?{path:rp(r.path),mode:'100644',type:'blob',sha:null}:{path:rp(r.path),mode:'100644',type:'blob',content:JSON.stringify(r.data,null,1)});
  const nt=await gh('/git/trees',{method:'POST',body:JSON.stringify({base_tree:t.tree,tree})});
  const nc=await gh('/git/commits',{method:'POST',body:JSON.stringify({message:'Vault update '+new Date().toISOString().slice(0,16).replace('T',' '),tree:nt.sha,parents:[t.head]})});
  await gh('/git/refs/heads/'+encodeURIComponent(cfg.branch),{method:'PATCH',body:JSON.stringify({sha:nc.sha})});
  const m=new Map((await gh('/git/trees/'+nt.sha+'?recursive=1')).tree.map(x=>[x.path,x.sha]));
  for(const r of dirty)r.del?await drop(r.path):await store({...F.get(r.path),sha:m.get(rp(r.path)),dirty:false});
  return dirty.length}
async function run(label,fn){
  if(!ready())return toast('Connect GitHub first',1);
  toast(label+'...');
  try{await fn();render()}catch(e){toast(/404|409/.test(e.message)?'Repo/branch not found or empty. Add a README commit first. ('+e.message+')':e.message,1)}
}

async function del(k,id){
  if(k==='u'){if(!confirm('Delete this universe and everything in it?'))return;for(const p of [...F.keys()].filter(p=>p.startsWith(`u/${id}/`)))await rm(kind(p),id,p.split('/').pop().replace('.json',''));ui.u=null}

async function tapNode(id){
  if(!ui.lm)return sheet(id);
  if(!ui.src){ui.src=id;return canvas()}
  if(ui.src===id){ui.src=null;return canvas()}
  const l=prompt('Relationship label (e.g. mentor of, rivals, born in)','');
  if(l!==null){const r={id:uid(),from:ui.src,to:id,label:l.trim()};await save('r',ui.u,r)}
  ui.src=null;render()}
async function editEdge(id){
  const r=get('r',ui.u,id);if(!r)return;
  const v=prompt('Relationship label. Clear it and press OK to delete this line.',r.label||'');if(v===null)return;
  if(!v.trim()){if(confirm('Delete this relationship?'))await rm('r',ui.u,id)}else{r.label=v.trim();await save('r',ui.u,r)}
  render()}
const dist=()=>{const p=[...ptr.values()];return Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1};
st.onpointerdown=e=>{
  if(e.target.closest('[data-ed],[data-rm]'))return;
  const b=curB();if(!b)return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});st.setPointerCapture(e.pointerId);
  if(ptr.size===2){drag={t:'pinch',d:dist()};return}
  const n=e.target.closest('[data-n]');
  drag=n?{t:'node',id:n.dataset.n,sx:e.clientX,sy:e.clientY,ox:b.nodes[n.dataset.n].x,oy:b.nodes[n.dataset.n].y,moved:false}:{t:'pan',sx:e.clientX,sy:e.clientY,ox:vw.x,oy:vw.y,moved:false}};
st.onpointermove=e=>{
  if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!drag)return;
  if(drag.t==='pinch'){if(ptr.size===2){const d=dist(),p=[...ptr.values()];zoom(d/drag.d,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);drag.d=d}return}
  const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;
  if(drag.t==='pan'&&drag.moved){vw.x=drag.ox+dx;vw.y=drag.oy+dy;applyView()}
  if(drag.t==='node'&&drag.moved&&!ui.lm){const p=curB().nodes[drag.id];p.x=Math.round(drag.ox+dx/vw.k);p.y=Math.round(drag.oy+dy/vw.k);const el=st.querySelector(`[data-n="${drag.id}"]`);el.style.left=p.x+'px';el.style.top=p.y+'px';edges()}};
st.onpointerup=async e=>{
  ptr.delete(e.pointerId);const d=drag;if(d&&d.t==='pinch'){if(ptr.size<2)drag=null;return}
  drag=null;if(!d)return;
  if(d.t==='node'){if(d.moved&&!ui.lm)await save('b',ui.u,curB());else if(!d.moved)tapNode(d.id)}
  else if(!d.moved){const t=document.elementFromPoint(e.clientX,e.clientY),r=t&&t.closest('[data-r]');if(r)editEdge(r.dataset.r)}};
st.onpointercancel=()=>{ptr.clear();drag=null};
st.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9,e.clientX,e.clientY)};
$('#nodes').onclick=async e=>{
  const ed=e.target.closest('[data-ed]'),rm_=e.target.closest('[data-rm]');
  if(ed)openEd(structuredClone(get('e',ui.u,ed.dataset.ed)),false);
  if(rm_){const b=curB();delete b.nodes[rm_.dataset.rm];await save('b',ui.u,b);render()}};
$('#tl').onclick=()=>showTab('list');$('#tc').onclick=()=>showTab('canvas');
$('#bsel').onchange=e=>{ui.b=e.target.value;ui.src=null;canvas()};
$('#badd').onclick=addB;
$('#bren').onclick=async()=>{const b=curB(),n=b&&ask('Rename board',b.name);if(n){b.name=n;await save('b',ui.u,b);render()}};
$('#bdel').onclick=async()=>{const b=curB();if(b&&confirm('Delete this board? Entities and relationships are kept.')){await rm('b',ui.u,b.id);ui.b=null;render()}};
$('#lmode').onclick=()=>{ui.lm=!ui.lm;ui.src=null;canvas()};
$('#zin').onclick=()=>zoom(1.2);$('#zout').onclick=()=>zoom(1/1.2);
$('#zfit').onclick=()=>{const b=curB();if(!b)return;const p=Object.values(b.nodes);if(!p.length)return;
  const x0=Math.min(...p.map(a=>a.x)),y0=Math.min(...p.map(a=>a.y)),x1=Math.max(...p.map(a=>a.x))+NW,y1=Math.max(...p.map(a=>a.y))+NH,r=st.getBoundingClientRect();
  vw.k=Math.max(.2,Math.min(1.2,r.width/(x1-x0+80),r.height/(y1-y0+80)));vw.x=(r.width-(x1-x0)*vw.k)/2-x0*vw.k;vw.y=(r.height-(y1-y0)*vw.k)/2-y0*vw.k;applyView()};
async function place(ids){
  const b=curB();if(!b)return;let n=Object.keys(b.nodes).length;
  const r=st.getBoundingClientRect();
  ids.forEach((id,i)=>{if(ids.length===1){b.nodes[id]={x:Math.round((r.width/2-vw.x)/vw.k-NW/2),y:Math.round((r.height/2-vw.y)/vw.k-NH/2)}}else{b.nodes[id]={x:40+(n%5)*210,y:40+Math.floor(n/5)*100};n++}});
  await save('b',ui.u,b);render()}
$('#addn').onclick=()=>{const v=$('#addsel').value;if(v)place([v])};
$('#addscope').onclick=()=>{const b=curB();if(!b)return;const sc=ids();
  place(all('e',ui.u).filter(e=>!b.nodes[e.id]&&(!sc||(e.refs||[]).some(r=>sc.includes(r)))).sort(by).map(e=>e.id))};

/* ===== Slice 3: character sheets + images (images are stored as small JSON files: u/<uid>/i/<id>.json) ===== */
async function shrink(file,max,q){
  const url=URL.createObjectURL(file);
  const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(new Error('Could not read '+file.name));i.src=url});
  const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const g=c.getContext('2d');g.fillStyle='#0B0C10';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);return{url:c.toDataURL('image/jpeg',q),w:c.width,h:c.height}}
$('#fimg').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';if(!cur)return;toast('Processing '+fs.length+' image(s)...');
  for(const f of fs){try{
    const a=await shrink(f,1400,.82),t=await shrink(f,256,.7),id=uid();
    await save('i',ui.u,{id,name:f.name,data:a.url,thumb:t.url,w:a.w,h:a.h});
    cur.images.push(id);cur._added.push(id);if(!cur.portrait)cur.portrait=id}catch(err){toast(err.message,1)}}
  $('#gal').innerHTML=galHTML(cur)};
function galHTML(e){return (e.images||[]).map(id=>{const im=get('i',ui.u,id);return im?`<div class="th"><img src="${im.thumb}" alt=""><button class="sm" data-pt="${id}" title="Set as portrait">${e.portrait===id?'&#9733;':'&#9734;'}</button><button class="sm dg" data-ri="${id}">&#10005;</button></div>`:''}).join('')}
const sec=(t,h)=>h?`<div class="lab">${t}</div>${h}`:'';
let shId=null;
function sheet(id){
  const e=get('e',ui.u,id);if(!e)return;shId=id;
  const im=x=>get('i',ui.u,x),por=im(e.portrait),nm=i=>(get('e',ui.u,i)||{}).name||'?';
  const kv=a=>a&&a.length?`<table class="kv">${a.map(f=>`<tr><td>${esc(f.k)}</td><td>${esc(f.v)}</td></tr>`).join('')}</table>`:'';
  const inv=(e.inventory||[]).map(i=>`<div>${i.ref&&get('e',ui.u,i.ref)?`<a data-sh="${i.ref}">${esc(i.name)}</a>`:esc(i.name)}${i.qty?' &times; '+esc(i.qty):''}</div>`).join('');
  const rel=all('r',ui.u).filter(r=>r.from===id||r.to===id).map(r=>r.from===id?`<div>&rarr; ${esc(r.label||'linked')} &rarr; <a data-sh="${r.to}">${esc(nm(r.to))}</a></div>`:`<div><a data-sh="${r.from}">${esc(nm(r.from))}</a> &rarr; ${esc(r.label||'linked')} &rarr; this</div>`).join('');
  const gal=(e.images||[]).filter(im).map(x=>`<img class="gi2" data-lb="${x}" src="${im(x).thumb}" alt="">`).join('');
  const ap=(e.refs||[]).map(r=>(get('p',ui.u,r)||get('w',ui.u,r)||{}).name).filter(Boolean).join(', ');
  $('#sht').textContent=e.name;
  $('#shb').innerHTML=`<div class="shh">${por?`<img class="por" data-lb="${por.id}" src="${por.thumb}" alt="">`:''}<div><span class="chip c">${esc(e.type)}</span> ${(e.tags||[]).map(t=>`<i>#${esc(t)}</i>`).join(' ')}<p>${esc(e.summary)}</p></div></div>`+
    sec('Details',kv(e.fields))+sec('Physical traits',kv(e.traits))+sec('Personality',e.personality?`<div class="pre">${esc(e.personality)}</div>`:'')+sec('Inventory',inv)+sec('Relationships',rel)+sec('Gallery',gal?`<div class="gal">${gal}</div>`:'')+sec('Notes',e.notes?`<div class="pre">${esc(e.notes)}</div>`:'')+sec('Appears in',ap?`<div>${esc(ap)}</div>`:'')+
    `<div class="acts no-print"><button class="pri" id="she">Edit</button><button id="shp">Print</button></div>`;
  if(!$('#sh').open)$('#sh').showModal()}
$('#shb').onclick=e=>{
  const l=e.target.closest('[data-lb]'),s=e.target.closest('[data-sh]');
  if(l){const im=get('i',ui.u,l.dataset.lb);if(im){$('#lbi').src=im.data;$('#lb').showModal()}}
  else if(s)sheet(s.dataset.sh);
  else if(e.target.closest('#she')){$('#sh').close();openEd(structuredClone(get('e',ui.u,shId)),false)}
  else if(e.target.closest('#shp'))window.print()};
$('#edb').onchange=e=>{if(e.target.id==='et'){const c=$('#edb .cs');if(c)c.hidden=e.target.value!=='character'}};
$('#ed').addEventListener('close',async()=>{
  if(edSaved||!cur||!cur._added||!cur._added.length)return;
  for(const x of cur._added)await rm('i',ui.u,x);cur._added=[];render()});

$('#bimp').onclick=()=>$('#fimp').click();
$('#fimp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const b=JSON.parse(await f.text());
    if(b.format!=='wv-bundle'||!Array.isArray(b.files))throw new Error('Not a vault bundle file');
    if(!confirm('Import '+b.files.length+' items? Items with the same id will be replaced.'))return;
    for(const x of b.files)await store({...(F.get(x.path)||{}),path:x.path,data:x.data,dirty:true,del:false});
    const u=b.files.find(x=>kind(x.path)==='u');if(u)ui.u=u.data.id;ui.p=ui.w=null;ui.tag='';
    render();toast(b.files.length+' items imported. Review them, then press Commit.');
  }catch(err){toast(err.message,1)}
};
/* init */
$('#ver').textContent='v'+VER;
function tick(){const d=new Date();$('#clk').textContent=d.toLocaleTimeString([],{hour12:false});$('#dt').textContent=d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'})+' // SYNC: '+(ready()?'OK':'OFFLINE')}
tick();setInterval(tick,1000);
(async()=>{(await io('readonly',s=>s.getAll())).forEach(r=>F.set(r.path,r));render()})();
</script>
